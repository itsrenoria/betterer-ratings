<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>betterer-ratings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0b0c0f;
  --card:#111317;
  --card-hover:#141820;
  --border:#1b2028;
  --border-subtle:#15191f;
  --text:#fafafa;
  --text-secondary:#8b949e;
  --text-muted:#4b5563;
  --emerald:#54d18a;
  --emerald-dim:rgba(16,185,129,.12);
  --blue:#6b8fd6;
  --blue-dim:rgba(59,130,246,.12);
  --violet:#8d7bd9;
  --violet-dim:rgba(139,92,246,.12);
  --amber:#d6a545;
  --amber-dim:rgba(245,158,11,.12);
  --red:#e45b65;
  --red-dim:rgba(239,68,68,.12);
  --font-body:'Plus Jakarta Sans',system-ui,sans-serif;
  --font-mono:'JetBrains Mono',monospace;
  --radius:8px;
  --radius-sm:5px;
  --radius-pill:100px;
}
html{font-size:14px;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body{
  font-family:var(--font-body);
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  background-image:linear-gradient(rgba(255,255,255,.015) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.012) 1px,transparent 1px);
  background-size:28px 28px;
}
a{color:inherit;text-decoration:none}

/* ─── TOP NAV ─── */
.topnav{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 24px;
  border-bottom:1px solid var(--border);
  background:rgba(9,9,11,.85);
  backdrop-filter:blur(12px);
  position:sticky;top:0;z-index:100;
}
.topnav-brand{display:flex;align-items:center;gap:10px}
.brand-mark{
  width:18px;height:18px;border:2px solid var(--emerald);border-radius:50%;
  position:relative;box-shadow:0 0 0 4px rgba(16,185,129,.08);
}
.brand-mark::after{
  content:'';position:absolute;left:7px;top:3px;width:2px;height:8px;
  background:var(--emerald);border-radius:2px;transform-origin:bottom center;transform:rotate(-35deg);
}
.topnav-brand>span{font-weight:700;font-size:1rem;letter-spacing:-.02em}
.activity-matrix{
  --matrix-glow:rgba(84,209,138,.08);
  display:grid;grid-template-columns:repeat(5,3px);grid-auto-rows:3px;gap:2px;
  padding:4px;margin-left:2px;border:1px solid #272d36;border-radius:5px;
  background:#090b0e;box-shadow:inset 0 0 8px rgba(0,0,0,.7),0 0 10px var(--matrix-glow);
}
.matrix-dot{
  width:3px;height:3px;border-radius:1px;background:var(--dot-color,#303641);
  opacity:.18;box-shadow:none;transition:opacity .3s ease,background-color .3s ease,box-shadow .3s ease;
}
.matrix-dot.steady{opacity:.68;box-shadow:0 0 3px var(--dot-color)}
.matrix-dot.queued{opacity:.38}
.matrix-dot.active{
  opacity:1;box-shadow:0 0 5px var(--dot-color);
  animation:matrix-pulse 1.65s ease-in-out infinite;animation-delay:var(--pulse-delay,0s);
}
.matrix-dot.alert{
  --dot-color:var(--red)!important;opacity:1;box-shadow:0 0 6px var(--red);
  animation:matrix-alert 1.1s ease-in-out infinite;animation-delay:var(--pulse-delay,0s);
}
@keyframes matrix-pulse{0%,100%{opacity:.42}45%{opacity:1}65%{opacity:.72}}
@keyframes matrix-alert{0%,100%{opacity:.55}50%{opacity:1}}
@media(prefers-reduced-motion:reduce){.matrix-dot.active,.matrix-dot.alert{animation:none}}
.topnav-right{display:flex;align-items:center;gap:16px}
.topnav-status{display:flex;align-items:center;gap:6px;font-size:.7rem;color:var(--text-secondary)}
.topnav-status .dot{width:6px;height:6px;border-radius:50%;background:var(--emerald);animation:pulse-dot 2s infinite}
@keyframes pulse-dot{0%,100%{opacity:1}50%{opacity:.4}}

/* ─── TAB BAR ─── */
.tab-bar{
  display:flex;gap:0;padding:0 24px;
  border-bottom:1px solid var(--border);
  background:rgba(17,17,19,.6);
}
.tab-btn{
  padding:12px 20px;font-size:.8rem;font-weight:600;
  color:var(--text-secondary);cursor:pointer;
  border:none;background:none;position:relative;
  transition:color .15s;letter-spacing:.02em;
  text-transform:uppercase;
}
.tab-btn:hover{color:var(--text)}
.tab-btn.active{color:var(--emerald)}
.tab-btn.active::after{
  content:'';position:absolute;bottom:-1px;left:12px;right:12px;
  height:2px;background:var(--emerald);border-radius:2px 2px 0 0;
}

/* ─── MAIN ─── */
.main{padding:20px 24px 40px;max-width:1440px;margin:0 auto}

/* ─── TAB PANELS ─── */
.tab-panel{display:none;animation:tabIn .25s ease}
.tab-panel.active{display:block}
@keyframes tabIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

/* ─── STAT CARDS ─── */
.stats-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:20px}
@media(max-width:1100px){.stats-grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:640px){.stats-grid{grid-template-columns:repeat(2,1fr)}}

.stat-card{
  background:linear-gradient(180deg,rgba(255,255,255,.025),rgba(255,255,255,.006)),var(--card);
  border:1px solid var(--border);border-radius:var(--radius);
  padding:13px 14px 12px;position:relative;overflow:hidden;
  min-height:94px;transition:border-color .2s,background .2s;
}
.stat-card:hover{border-color:#2b333f;background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.01)),var(--card-hover)}
.stat-accent{position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--accent,var(--emerald));opacity:.9}
.stat-card .stat-label{font-size:.59rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text-secondary);margin-bottom:7px}
.stat-card .stat-value{font-family:var(--font-mono);font-size:1.42rem;font-weight:700;line-height:1;color:var(--text);margin-bottom:7px}
.stat-card .stat-sub{font-size:.7rem;color:var(--text-muted)}
.stat-card .stat-total{font-family:var(--font-mono);font-size:.72rem;font-weight:600;color:var(--text-secondary);margin-top:5px}
.stat-card .stat-total-label{font-size:.56rem;text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted);margin-top:2px}
.stat-titles{--accent:#7eb68f}.stat-ratings{--accent:#54d18a}.stat-mappings{--accent:#8d7bd9}.stat-episodes{--accent:#d6a545}.stat-pending{--accent:#d6a545}.stat-failed{--accent:#e45b65}

/* ─── PANELS / CARDS ─── */
.panel{
  background:linear-gradient(180deg,rgba(255,255,255,.018),rgba(255,255,255,.004)),var(--card);
  border:1px solid var(--border);border-radius:var(--radius);
  margin-bottom:16px;overflow:hidden;
}
.panel-header{
  padding:12px 16px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
}
.panel-title{font-size:.76rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em}
.panel-badge{font-family:var(--font-mono);font-size:.7rem;color:var(--text-secondary)}
.panel-body{padding:14px 16px}
.trend-meta{display:flex;align-items:center;justify-content:flex-end;gap:14px;flex-wrap:wrap}
.trend-legend{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.trend-legend span{display:inline-flex;align-items:center;gap:5px;font-size:.66rem;color:var(--text-secondary);font-family:var(--font-mono)}
.trend-legend i{width:8px;height:8px;border-radius:2px;background:var(--legend-color)}
@media(max-width:760px){
  .panel-header{align-items:flex-start;gap:10px;flex-direction:column}
  .trend-meta{justify-content:flex-start;gap:8px}
}

/* ─── KPI STRIPS ─── */
.kpi-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.kpi-tile{
  background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.015));
  border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;
}
.kpi-label{font-size:.62rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text-secondary);margin-bottom:6px}
.kpi-value{font-family:var(--font-mono);font-size:1.35rem;font-weight:700}
.kpi-value.good{color:var(--emerald)}
.kpi-value.warn{color:var(--amber)}
.kpi-value.bad{color:var(--red)}
@media(max-width:900px){.kpi-strip{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.kpi-strip{grid-template-columns:1fr}}

/* ─── TWO COL ─── */
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:900px){.two-col{grid-template-columns:1fr}}

/* ─── THREE COL ─── */
.three-col{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media(max-width:900px){.three-col{grid-template-columns:1fr}}

/* ─── TABLES ─── */
.data-table{width:100%;border-collapse:collapse}
.data-table th{
  font-size:.65rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;
  color:var(--text-secondary);text-align:left;padding:8px 10px;
  border-bottom:1px solid var(--border);
}
.data-table th.r{text-align:right}
.data-table td{
  padding:8px 10px;border-bottom:1px solid var(--border-subtle);
  font-size:.8rem;vertical-align:middle;
}
.data-table td.mono{font-family:var(--font-mono);text-align:right;font-weight:500}
.data-table tr:last-child td{border-bottom:none}
.data-table tr:hover td{background:rgba(255,255,255,.02)}
.data-table.compact td{padding:6px 10px}
.data-table.compact th{padding:7px 10px}

/* ─── STATUS PILLS ─── */
.pill{
  display:inline-flex;align-items:center;
  padding:2px 8px;border-radius:var(--radius-pill);
  font-size:.65rem;font-weight:600;font-family:var(--font-mono);
  white-space:nowrap;
}
.pill-submitted{background:var(--emerald-dim);color:var(--emerald)}
.pill-pending{background:var(--amber-dim);color:var(--amber)}
.pill-failed{background:var(--red-dim);color:var(--red)}
.pill-inflight,.pill-in_flight{background:var(--blue-dim);color:var(--blue)}
.pill-movie{background:var(--blue-dim);color:var(--blue)}
.pill-tv{background:var(--violet-dim);color:var(--violet)}
.pill-active{background:var(--emerald-dim);color:var(--emerald)}
.pill-paused{background:var(--red-dim);color:var(--red)}
.pill-debug{background:var(--blue-dim);color:var(--blue)}
.pill-info{background:var(--emerald-dim);color:var(--emerald)}
.pill-warning{background:var(--amber-dim);color:var(--amber)}
.pill-error{background:var(--red-dim);color:var(--red)}
.pill-critical{background:var(--red-dim);color:var(--red);font-weight:800}

/* ─── PROGRESS BAR ─── */
.stacked-bar{display:flex;height:6px;border-radius:3px;overflow:hidden;background:rgba(255,255,255,.04);margin:12px 0 8px}
.stacked-bar span{height:100%;transition:width .4s ease}
.stacked-bar .seg-submitted{background:var(--emerald)}
.stacked-bar .seg-pending{background:var(--amber)}
.stacked-bar .seg-failed{background:var(--red)}
.stacked-bar .seg-inflight{background:var(--blue)}

/* ─── RATE LIMIT BAR ─── */
.rate-bar-track{height:4px;border-radius:2px;background:rgba(255,255,255,.06);margin:6px 0}
.rate-bar-fill{height:100%;border-radius:2px;background:var(--emerald);transition:width .4s}

/* ─── HORIZONTAL BAR CHART ─── */
.hbar-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.hbar-label{font-size:.75rem;width:60px;color:var(--text-secondary);text-transform:uppercase;font-weight:600}
.hbar-track{flex:1;height:20px;background:rgba(255,255,255,.04);border-radius:4px;overflow:hidden}
.hbar-fill{height:100%;border-radius:4px;transition:width .5s ease;display:flex;align-items:center;padding-left:8px;font-family:var(--font-mono);font-size:.65rem;font-weight:600;color:#06100b;min-width:fit-content}
.hbar-count{font-family:var(--font-mono);font-size:.75rem;width:50px;text-align:right;font-weight:500}

/* ─── PROVIDER CARD ─── */
.provider-card{padding:16px 18px}
.provider-card .provider-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.provider-card .provider-name{font-weight:700;font-size:.85rem;display:flex;align-items:center;gap:8px}
.provider-card .provider-name .dot{width:8px;height:8px;border-radius:50%}
.provider-card .provider-meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.provider-card .meta-item label{display:block;font-size:.6rem;text-transform:uppercase;letter-spacing:.06em;color:var(--text-secondary);font-weight:600;margin-bottom:2px}
.provider-card .meta-item span{font-family:var(--font-mono);font-size:.8rem;font-weight:500}

/* ─── RATING DOTS ─── */
.rating-dots{display:flex;gap:3px;flex-wrap:wrap}
.rating-dot{
  width:20px;height:18px;border-radius:3px;display:flex;align-items:center;justify-content:center;
  font-size:.5rem;font-weight:700;font-family:var(--font-mono);
}
.rating-dot.submitted{background:var(--emerald-dim);color:var(--emerald)}
.rating-dot.pending{background:var(--amber-dim);color:var(--amber)}
.rating-dot.failed{background:var(--red-dim);color:var(--red)}

/* ─── SVG CHART ─── */
.chart-container{width:100%;position:relative}
.chart-container svg{display:block;width:100%}
.trend-chart{padding:8px 0 0;min-height:280px}
.trend-chart svg{height:280px;max-width:100%}
.chart-tooltip{
  position:absolute;z-index:5;pointer-events:none;min-width:160px;
  padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);
  background:rgba(9,9,11,.96);box-shadow:0 12px 30px rgba(0,0,0,.35);
  font-size:.74rem;color:var(--text-secondary);line-height:1.45;transform:translate(-50%,-112%);
}
.chart-tooltip strong{display:block;color:var(--text);font-size:.78rem;margin-bottom:4px}
.chart-tooltip .row{display:flex;justify-content:space-between;gap:18px;font-family:var(--font-mono)}
.trend-hit{cursor:crosshair}
.trend-hit:hover{fill:rgba(255,255,255,.04)}
.trend-segment{shape-rendering:geometricPrecision;transition:opacity .15s ease,filter .15s ease}
.trend-segment:hover{opacity:1;filter:brightness(1.2)}
.trend-guide{pointer-events:none;opacity:0;transition:opacity .12s ease}
.trend-chart:hover .trend-guide{opacity:1}

/* ─── QUEUE BIG NUMBER ─── */
.q-big{font-family:var(--font-mono);font-size:2.2rem;font-weight:700;line-height:1}
.q-row{display:flex;gap:16px;margin-top:10px;flex-wrap:wrap}
.q-item{font-size:.7rem;color:var(--text-secondary)}
.q-item span{font-family:var(--font-mono);font-weight:600}
.queue-state{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.queue-state-label{font-size:.7rem;color:var(--text-secondary)}

/* ─── INDICATOR DOT ─── */
.idot{width:6px;height:6px;border-radius:50%;display:inline-block;margin-right:6px;flex-shrink:0}

/* ─── ERROR TEXT ─── */
.err-text{color:var(--red);font-size:.7rem;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.error-chip{
  display:inline-flex;max-width:180px;align-items:center;
  padding:2px 7px;border-radius:var(--radius-sm);
  background:rgba(239,68,68,.08);color:#f87171;
  border:1px solid rgba(239,68,68,.18);
  font-size:.68rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}

/* ─── LOADING STATE ─── */
.loading-shimmer{
  background:linear-gradient(90deg,var(--card) 25%,#1a1a1d 50%,var(--card) 75%);
  background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:4px;
}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.loading-block{height:16px;margin:6px 0}

/* ─── SCROLL ─── */
.scroll-x{overflow-x:auto}
.scroll-x::-webkit-scrollbar{height:4px}
.scroll-x::-webkit-scrollbar-track{background:transparent}
.scroll-x::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}

/* ─── ACTIVITY ─── */
.activity-grid{display:grid;grid-template-columns:1fr;gap:16px}

/* ─── LOGS ─── */
.log-toolbar{display:flex;align-items:center;gap:10px}
.log-select{
  background:var(--card);border:1px solid var(--border);color:var(--text);
  border-radius:var(--radius-sm);padding:4px 8px;font-size:.7rem;font-family:var(--font-body);
}
.log-clear-btn{
  background:none;border:1px solid var(--border);color:var(--text-secondary);
  border-radius:var(--radius-sm);padding:4px 10px;font-size:.7rem;cursor:pointer;
  transition:color .15s,border-color .15s;
}
.log-clear-btn:hover{color:var(--text);border-color:#2b333f}
.log-list{max-height:560px;overflow-y:auto;font-family:var(--font-mono);font-size:.72rem}
.log-row{display:flex;align-items:flex-start;gap:10px;padding:6px 10px;border-bottom:1px solid var(--border-subtle)}
.log-row:hover{background:rgba(255,255,255,.02)}
.log-time{color:var(--text-muted);white-space:nowrap;flex-shrink:0;width:70px}
.log-component{color:var(--text-secondary);white-space:nowrap;flex-shrink:0;min-width:76px}
.log-message{color:var(--text);flex:1;min-width:0;word-break:break-word;line-height:1.5}
.log-context{color:var(--text-secondary);margin-left:6px}
.log-exception{white-space:pre-wrap;color:var(--red);font-size:.68rem;margin-top:4px}
</style>
</head>
<body>

<!-- ═══ TOP NAV ═══ -->
<nav class="topnav">
  <div class="topnav-brand">
    <span class="brand-mark" aria-hidden="true"></span>
    <span>betterer-ratings</span>
    <div class="activity-matrix" id="activity-matrix" role="img" aria-label="Activity status is loading" title="Activity status is loading" aria-live="polite"></div>
  </div>
  <div class="topnav-right">
    <div class="topnav-status">
      <span class="dot"></span>
      <span id="nav-last-update">Connecting…</span>
    </div>
  </div>
</nav>

<!-- ═══ TAB BAR ═══ -->
<div class="tab-bar">
  <button class="tab-btn active" data-tab="overview">Overview</button>
  <button class="tab-btn" data-tab="queue">Queue</button>
  <button class="tab-btn" data-tab="providers">Providers</button>
  <button class="tab-btn" data-tab="activity">Activity</button>
  <button class="tab-btn" data-tab="logs">Logs</button>
</div>

<!-- ═══ MAIN ═══ -->
<div class="main">

  <!-- ── TAB: OVERVIEW ── -->
  <div class="tab-panel active" id="tab-overview">
    <div class="stats-grid" id="stats-grid">
      <!-- filled by JS -->
    </div>

    <div class="panel">
      <div class="panel-header">
        <span class="panel-title">Submission Trend</span>
        <div class="trend-meta">
          <span class="panel-badge" id="trend-total"></span>
          <div class="trend-legend">
            <span><i style="--legend-color:#54d18a"></i>Ratings</span>
            <span><i style="--legend-color:#8d7bd9"></i>Mappings</span>
            <span><i style="--legend-color:#d6a545"></i>Episodes</span>
          </div>
        </div>
      </div>
      <div class="panel-body chart-container trend-chart" id="trend-chart">
        <!-- SVG injected -->
      </div>
    </div>

    <div class="two-col">
      <div>
        <div class="panel">
          <div class="panel-header"><span class="panel-title">Titles by Type</span></div>
          <div class="panel-body" id="titles-bars"></div>
        </div>
        <div class="panel">
          <div class="panel-header"><span class="panel-title">Mappings by Type</span></div>
          <div class="panel-body"><div class="scroll-x"><table class="data-table" id="mappings-table"><thead><tr><th>Type</th><th class="r">Total</th><th class="r">Submitted</th><th class="r">Pending</th><th class="r">Failed</th></tr></thead><tbody></tbody></table></div></div>
        </div>
      </div>
      <div>
        <div class="panel">
          <div class="panel-header"><span class="panel-title">Ratings by Source</span></div>
          <div class="panel-body"><div class="scroll-x"><table class="data-table" id="ratings-table"><thead><tr><th>Source</th><th class="r">Count</th><th class="r">Submitted</th><th class="r">Pending</th><th class="r">Failed</th></tr></thead><tbody></tbody></table></div></div>
        </div>
      </div>
    </div>
  </div>

  <!-- ── TAB: QUEUE ── -->
  <div class="tab-panel" id="tab-queue">
    <div class="kpi-strip" id="queue-health"></div>
    <div class="three-col" id="queue-cards"></div>
  </div>

  <!-- ── TAB: PROVIDERS ── -->
  <div class="tab-panel" id="tab-providers">
    <div class="kpi-strip" id="provider-summary"></div>
    <div class="three-col" id="provider-cards"></div>
  </div>

  <!-- ── TAB: ACTIVITY ── -->
  <div class="tab-panel" id="tab-activity">
    <div class="activity-grid">
      <div class="panel">

<script>
/* ═══════════════════════════════════════════
   betterer-ratings dashboard
   ═══════════════════════════════════════════ */

// ─── Helpers ───
const fmt = n => n == null ? '—' : Number(n).toLocaleString();
const fmtDec = (n,d=1) => n == null ? '—' : Number(n).toFixed(d);
const esc = s => {const d=document.createElement('div');d.textContent=s;return d.innerHTML};

function epochMillis(ts) {
  if (ts == null || ts === '') return null;
  const numeric = Number(ts);
  if (!Number.isFinite(numeric) || numeric <= 0) return null;
  return numeric < 1000000000000 ? numeric * 1000 : numeric;
}

function durationLabel(seconds) {
  const abs = Math.abs(seconds);
  if (abs < 5) return 'just now';
  if (abs < 60) return Math.floor(abs)+'s';
  if (abs < 3600) return Math.floor(abs/60)+'m';
  if (abs < 86400) return Math.floor(abs/3600)+'h';
  return Math.floor(abs/86400)+'d';
}

function relTime(ts) {
  const ms = epochMillis(ts);
  if (ms == null) return '—';
  const d = new Date(epochMillis(ts));
  if (isNaN(d)) return '—';
  const s = Math.floor((Date.now()-ms)/1000);
  const label = durationLabel(s);
  if (label === 'just now') return label;
  return s < 0 ? `in ${label}` : `${label} ago`;
}

const labelColors = {
  IM:'#f59e0b',RT:'#ef4444',MC:'#8b5cf6',TM:'#3b82f6',PC:'#10b981',LB:'#f97316',TR:'#ec4899',ML:'#06b6d4',RE:'#84cc16',
  imdb:'#f59e0b',trakt:'#ec4899',tvdb:'#3b82f6',mal:'#06b6d4'
};
function labelColor(l){return labelColors[l]||labelColors[String(l||'').toLowerCase()]||'#71717a'}

// ─── Tabs ───
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-'+btn.dataset.tab).classList.add('active');
  });
});

// ─── State ───
let state = {};
let matrixPreviousTotals = null;
let logLevelFilter = 'ALL';
let logsClearedAtEpoch = 0;
let logsNewestVisibleTimestamp = 0;

function logsURL() {
  return logLevelFilter && logLevelFilter !== 'ALL'
    ? `/api/logs?level=${encodeURIComponent(logLevelFilter)}`
    : '/api/logs';
}

const MATRIX_LAYOUT = [
  'tmdb','tmdb','mdblist','pmdbApi','pmdbApi',
  'tmdb','ratings','ratings','mappings','pmdbApi',
  'mdblist','ratings','health','mappings','pmdbMappings',
  'episodes','ratings','ratings','mappings','pmdbMappings',
  'episodes','episodes','pmdbRatings','pmdbRatings','pmdbMappings',
];

const MATRIX_COLORS = {
  tmdb:'var(--blue)', mdblist:'var(--amber)', pmdbApi:'var(--violet)',
  pmdbRatings:'var(--emerald)', pmdbMappings:'var(--violet)',
  ratings:'var(--emerald)', mappings:'var(--violet)', episodes:'var(--amber)',
  health:'var(--emerald)',
};

async function fetchJSON(url) {
  try { const r = await fetch(url); if(!r.ok) throw 0; return await r.json(); }
  catch(e){ return null; }
}

async function loadAll() {
  const [stats,services,titlesSummary,ratingsSummary,mappingsSummary,episodesSummary,metricsHistory,titlesRecent,titlesDaily,logs] = await Promise.all([
    fetchJSON('/api/stats'),
    fetchJSON('/api/services'),
    fetchJSON('/api/titles/summary'),
    fetchJSON('/api/ratings/summary'),
    fetchJSON('/api/mappings/summary'),
    fetchJSON('/api/episodes/summary'),
    fetchJSON('/api/metrics/history'),
    fetchJSON('/api/titles/recent'),
    fetchJSON('/api/titles/daily'),
    fetchJSON(logsURL()),
  ]);
  state = {stats,services,titlesSummary,ratingsSummary,mappingsSummary,episodesSummary,metricsHistory,titlesRecent,titlesDaily,logs};
  render();
  document.getElementById('nav-last-update').textContent = 'Updated '+new Date().toLocaleTimeString();
}

// ─── Render ───
function render() {
  renderActivityMatrix();
  renderStats();
  renderTrend();
  renderTitlesBars();
  renderMappingsTable();
  renderRatingsTable();
  renderQueueHealth();
  renderQueueCards();
  renderProviderSummary();
  renderProviders();
  renderRecent();
  renderLogs();
}

function renderActivityMatrix() {
  const matrix = document.getElementById('activity-matrix');
  if (!matrix) return;

  const q = state.stats?.queue || {};
  const services = Object.fromEntries((state.services?.services || []).map(s => [s.service || s.name, s]));
  const totals = {
    ratings:Number(state.stats?.summary?.ratings_today || 0),
    mappings:Number(state.stats?.summary?.mappings_today || 0),
    episodes:Number(state.stats?.summary?.episode_ratings_today || 0),
  };
  const recentlyAdvanced = {
    ratings:matrixPreviousTotals !== null && totals.ratings > matrixPreviousTotals.ratings,
    mappings:matrixPreviousTotals !== null && totals.mappings > matrixPreviousTotals.mappings,
    episodes:matrixPreviousTotals !== null && totals.episodes > matrixPreviousTotals.episodes,
  };

  const providerState = name => {
    const svc = services[name];
    if (!svc) return {mode:'idle'};
    const status = Number(svc.last_status || 0);
    if (svc.is_paused || status >= 400) return {mode:'alert'};
    if (status >= 200 && status < 300) {
      const updated = svc.updated_at ? epochMillis(svc.updated_at) : 0;
      return {mode:updated && Date.now() - updated < 15000 ? 'active' : 'steady'};
    }
    return {mode:'queued'};
  };
  const queueState = (kind, progressKind) => {
    const failed = Number(q[`${kind}_failed`] || 0);
    const inFlight = Number(q[`${kind}_in_flight`] || 0);
    const pending = Number(q[`${kind}_pending`] || 0);
    if (failed > 0) return {mode:'alert'};
    if (inFlight > 0 || recentlyAdvanced[progressKind]) return {mode:'active'};
    if (pending > 0) return {mode:'queued'};
    return {mode:'idle'};
  };

  const cellStates = {
    tmdb:providerState('tmdb'),
    mdblist:providerState('mdblist'),
    pmdbApi:providerState('pmdb_api'),
    pmdbRatings:providerState('pmdb_ratings'),
    pmdbMappings:providerState('pmdb_mappings'),
    ratings:queueState('ratings', 'ratings'),
    mappings:queueState('mappings', 'mappings'),
    episodes:queueState('episode_ratings', 'episodes'),
  };
  const failedRows = Number(q.ratings_failed || 0) + Number(q.mappings_failed || 0) + Number(q.episode_ratings_failed || 0);
  const problemProviders = Object.values(services).filter(s => s.is_paused || Number(s.last_status || 0) >= 400).length;
  const inFlight = Number(q.ratings_in_flight || 0) + Number(q.mappings_in_flight || 0) + Number(q.episode_ratings_in_flight || 0);
  const pending = Number(q.ratings_pending || 0) + Number(q.mappings_pending || 0) + Number(q.episode_ratings_pending || 0);
  const dataUnavailable = !state.stats || !state.services;
  const hasProblem = failedRows > 0 || problemProviders > 0 || dataUnavailable;
  cellStates.health = {mode:hasProblem ? 'alert' : inFlight > 0 ? 'active' : 'steady'};

  matrix.innerHTML = MATRIX_LAYOUT.map((role, index) => {
    const item = cellStates[role] || {mode:'idle'};
    return `<span class="matrix-dot ${item.mode}" style="--dot-color:${MATRIX_COLORS[role]};--pulse-delay:-${(index % 7) * 0.17}s" aria-hidden="true"></span>`;
  }).join('');

  const providerSummary = dataUnavailable
    ? 'dashboard data unavailable'
    : problemProviders
    ? `${problemProviders} provider warning${problemProviders === 1 ? '' : 's'}`
    : 'providers healthy';
  const label = `Activity: ${inFlight} in flight, ${pending} queued, ${failedRows} failed; ${providerSummary}`;
  matrix.setAttribute('aria-label', label);
  matrix.title = `${label}. Blue: TMDB; amber: MDBList and episodes; violet: PMDB and mappings; green: ratings and health; red: paused or failed.`;
  matrix.style.setProperty('--matrix-glow', hasProblem ? 'rgba(228,91,101,.16)' : inFlight > 0 ? 'rgba(84,209,138,.14)' : 'rgba(84,209,138,.06)');
  matrixPreviousTotals = totals;
}

// ── Stats Hero Row ──
function renderStats() {
  const s = state.stats?.summary || {};
  const q = state.stats?.queue || {};
  const today = s.day || new Date().toISOString().slice(0,10);
  const dailyTitles = state.titlesDaily?.daily_titles || [];
  const titleDay = dailyTitles.find(d=>d.day_key === today);

  const pendingTotal = (q.ratings_pending||0)+(q.episode_ratings_pending||0)+(q.mappings_pending||0);
  const inFlightTotal = (q.ratings_in_flight||0)+(q.episode_ratings_in_flight||0)+(q.mappings_in_flight||0);
  const failedTotal = (q.ratings_failed||0)+(q.episode_ratings_failed||0)+(q.mappings_failed||0);

  const cards = [
    {label:'Titles Today',value:fmt(titleDay?.title_count||0),total:fmt(s.titles_total),totalLabel:'total titles',cls:'stat-titles'},
    {label:'Ratings Today',value:fmt(s.ratings_today),total:fmt(s.ratings_total),totalLabel:'total ratings',cls:'stat-ratings'},
    {label:'Mappings Today',value:fmt(s.mappings_today),total:fmt(s.mappings_total),totalLabel:'total mappings',cls:'stat-mappings'},
    {label:'Episodes Today',value:fmt(s.episode_ratings_today),total:fmt(s.episode_ratings_total),totalLabel:'total episodes',cls:'stat-episodes'},
    {label:'Queue Pending',value:fmt(pendingTotal),total:fmt(inFlightTotal),totalLabel:'in-flight now',cls:'stat-pending'},
    {label:'Queue Failed',value:fmt(failedTotal),total:fmt(pendingTotal),totalLabel:'pending backlog',cls:'stat-failed'},
  ];

  document.getElementById('stats-grid').innerHTML = cards.map(c=>`
    <div class="stat-card ${c.cls}">
      <span class="stat-accent"></span>
      <div class="stat-label">${c.label}</div>
      <div class="stat-value">${c.value}</div>
      <div class="stat-total">${c.total}</div>
      <div class="stat-total-label">${c.totalLabel}</div>
    </div>
  `).join('');
}

// ── Trend Chart ──
function renderTrend() {
  const daily = state.metricsHistory?.daily || [];
  const totals = state.metricsHistory?.totals;
  if (totals) {
    document.getElementById('trend-total').textContent = `${fmt(totals.ratings)} ratings · ${fmt(totals.mappings)} mappings · ${fmt(totals.episode_ratings)} episodes`;
  }
  const chart = document.getElementById('trend-chart');
  if (daily.length < 2) {
    chart.innerHTML = '<div style="text-align:center;padding:30px;color:var(--text-muted);font-size:.8rem">No trend data available</div>';
    return;
  }
  const W = 920, H = 260, PAD_L = 66, PAD_R = 22, PAD_T = 18, PAD_B = 38;
  const cw = W - PAD_L - PAD_R, ch = H - PAD_T - PAD_B;
  const n = daily.length;

  const maxStack = Math.max(...daily.map(d=>(d.ratings||0)+(d.mappings||0)+(d.episode_ratings||0)),1);
  const slot = cw / n;
  const barW = Math.max(5, Math.min(18, slot * .62));
  const segments = [
    {key:'episode_ratings',label:'Episodes',color:'#d6a545',cls:'episodes'},
    {key:'mappings',label:'Mappings',color:'#8d7bd9',cls:'mappings'},
    {key:'ratings',label:'Ratings',color:'#54d18a',cls:'ratings'},
  ];

  const gridLines = 4;
  let grid = '';
  for(let i=0;i<=gridLines;i++){
    const y = PAD_T + (i/gridLines)*ch;
    const val = Math.round(maxStack * (1 - i/gridLines));
    grid += `<line x1="${PAD_L}" y1="${y.toFixed(1)}" x2="${W-PAD_R}" y2="${y.toFixed(1)}" stroke="rgba(255,255,255,.045)" stroke-width="1"/>`;
    grid += `<text x="${PAD_L-10}" y="${(y+3.5).toFixed(1)}" text-anchor="end" fill="#69737f" font-size="10" font-family="'JetBrains Mono',monospace">${fmt(val)}</text>`;
  }
  grid += `<line x1="${PAD_L}" y1="${PAD_T+ch}" x2="${W-PAD_R}" y2="${PAD_T+ch}" stroke="rgba(255,255,255,.12)" stroke-width="1"/>`;

  let xLabels = '';
  const step = Math.max(1,Math.ceil(n/7));
  for(let i=0;i<n;i++){
    if(i % step !== 0 && i !== n-1) continue;
    const d = daily[i].date||'';
    const short = d.slice(5);
    const x = PAD_L + slot*i + slot/2;
    xLabels += `<text x="${x.toFixed(1)}" y="${PAD_T+ch+22}" text-anchor="middle" fill="#69737f" font-size="10" font-family="'JetBrains Mono',monospace">${short}</text>`;
  }

  let bars = '';
  let hits = '';
  daily.forEach((d,i)=>{
    const x = PAD_L + slot*i + (slot-barW)/2;
    let cursor = PAD_T + ch;
    segments.forEach(seg=>{
      const value = d[seg.key] || 0;
      if (value <= 0) return;
      const h = Math.max(1.4, (value/maxStack)*ch);
      cursor -= h;
      bars += `<rect class="trend-segment trend-${seg.cls}" data-index="${i}" x="${x.toFixed(1)}" y="${cursor.toFixed(1)}" width="${barW.toFixed(1)}" height="${h.toFixed(1)}" rx="2" fill="${seg.color}" opacity=".86">
        <title>${d.date || ''}: ${seg.label} ${fmt(value)}</title>
      </rect>`;
    });
    hits += `<rect class="trend-hit" data-index="${i}" x="${(PAD_L+slot*i).toFixed(1)}" y="${PAD_T}" width="${slot.toFixed(1)}" height="${ch}" fill="transparent"/>`;
  });

  const svg = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Submission trend for recent days">
    ${grid}${xLabels}
    ${bars}
    ${hits}
  </svg><div id="trend-tooltip" class="chart-tooltip" hidden></div>`;
  chart.innerHTML = svg;
  chart.querySelectorAll('.trend-hit').forEach(hit=>{
    hit.addEventListener('pointermove', event=>showTrendTooltip(event, Number(hit.dataset.index)));
    hit.addEventListener('pointerleave', hideTrendTooltip);
  });
}

function showTrendTooltip(event,index) {
  const daily = state.metricsHistory?.daily || [];
  const point = daily[index];
  const tooltip = document.getElementById('trend-tooltip');
  const chart = document.getElementById('trend-chart');
  if (!point || !tooltip || !chart) return;
  const total = (point.ratings||0)+(point.mappings||0)+(point.episode_ratings||0);
  const titleDay = (state.titlesDaily?.daily_titles || []).find(d=>d.day_key === point.date);
  tooltip.innerHTML = `
    <strong>${esc(point.date || 'Unknown day')}</strong>
    <div class="row"><span>Titles</span><span>${fmt(titleDay?.title_count||0)}</span></div>
    <div class="row"><span>Ratings</span><span>${fmt(point.ratings||0)}</span></div>
    <div class="row"><span>Mappings</span><span>${fmt(point.mappings||0)}</span></div>
    <div class="row"><span>Episodes</span><span>${fmt(point.episode_ratings||0)}</span></div>
    <div class="row"><span>Total</span><span>${fmt(total)}</span></div>
  `;
  const bounds = chart.getBoundingClientRect();
  const x = Math.min(Math.max(event.clientX - bounds.left, 96), bounds.width - 96);
  const y = Math.min(Math.max(event.clientY - bounds.top, 74), bounds.height - 20);
  tooltip.style.left = x+'px';
  tooltip.style.top = y+'px';
  tooltip.hidden = false;
}

function hideTrendTooltip() {
  const tooltip = document.getElementById('trend-tooltip');
  if (tooltip) tooltip.hidden = true;
}

// ── Titles by Type bars ──
function renderTitlesBars() {
  const byType = state.titlesSummary?.by_type || [];
  const max = Math.max(...byType.map(t=>t.total||0),1);
  const colors = {movie:'#3b82f6',tv:'#8b5cf6',person:'#f59e0b'};
  document.getElementById('titles-bars').innerHTML = byType.length === 0
    ? '<div style="color:var(--text-muted);font-size:.8rem">No data</div>'

    const pct = ((t.total||0)/max*100);
    const c = colors[t.media_type]||'#71717a';
    return `<div class="hbar-row">
      <span class="hbar-label">${esc(t.media_type||'?')}</span>
      <div class="hbar-track"><div class="hbar-fill" style="width:${Math.max(pct,2)}%;background:${c}">${fmt(t.total)}</div></div>
    </div>`;
  }).join('');
}

// ── Queue Health ──
function renderQueueHealth() {
  const q = state.stats?.queue || {};
  const s = state.stats?.summary || {};
  const pending = (q.ratings_pending||0)+(q.mappings_pending||0)+(q.episode_ratings_pending||0);
  const inflight = (q.ratings_in_flight||0)+(q.mappings_in_flight||0)+(q.episode_ratings_in_flight||0);
  const failed = (q.ratings_failed||0)+(q.mappings_failed||0)+(q.episode_ratings_failed||0);
  const submitted = (s.ratings_total||0)+(s.mappings_total||0)+(s.episode_ratings_total||0);
  const tiles = [
    {label:'Pending',value:pending,cls:pending?'warn':'good'},
    {label:'In Flight',value:inflight,cls:inflight?'warn':'good'},
    {label:'Failed',value:failed,cls:failed?'bad':'good'},
    {label:'Submitted',value:submitted,cls:'good'},
  ];
  document.getElementById('queue-health').innerHTML = tiles.map(t=>`
    <div class="kpi-tile">
      <div class="kpi-label">${t.label}</div>
      <div class="kpi-value ${t.cls}">${fmt(t.value)}</div>
    </div>
  `).join('');
}

// ── Queue Cards ──
function renderQueueCards() {
  const q = state.stats?.queue || {};
  const rStatus = state.ratingsSummary?.by_status || [];
  const mStatus = state.mappingsSummary?.by_status || [];
  const eStatus = state.episodesSummary?.by_status || [];

  function statusMap(arr){
    const m={};(arr||[]).forEach(s=>{m[(s.pmdb_status||'').toLowerCase()]=s.total||0});return m;
  }

  const queues = [
    {name:'Ratings',pending:q.ratings_pending||0,inflight:q.ratings_in_flight||0,failed:q.ratings_failed||0,statuses:statusMap(rStatus),color:'var(--emerald)'},
    {name:'Mappings',pending:q.mappings_pending||0,inflight:q.mappings_in_flight||0,failed:q.mappings_failed||0,statuses:statusMap(mStatus),color:'var(--violet)'},
    {name:'Episodes',pending:q.episode_ratings_pending||0,inflight:q.episode_ratings_in_flight||0,failed:q.episode_ratings_failed||0,statuses:statusMap(eStatus),color:'var(--amber)'},
  ];

  document.getElementById('queue-cards').innerHTML = queues.map(qc=>{
    const total = Math.max(qc.pending+qc.inflight+qc.failed,1);
    const pPct=(qc.pending/total*100).toFixed(1);
    const iPct=(qc.inflight/total*100).toFixed(1);
    const fPct=(qc.failed/total*100).toFixed(1);
    const submitted = qc.statuses['submitted']||0;
    const stateLabel = qc.failed ? 'Needs attention' : qc.inflight ? 'Working' : qc.pending ? 'Queued' : 'Clear';
    const stateClass = qc.failed ? 'pill-failed' : (qc.inflight || qc.pending) ? 'pill-pending' : 'pill-active';
    return `<div class="panel">
      <div class="panel-header"><span class="panel-title">${qc.name} Queue</span></div>
      <div class="panel-body">
        <div class="queue-state">
          <div>
            <div class="q-big" style="color:${qc.color}">${fmt(qc.pending)}</div>
            <div class="queue-state-label">pending</div>
          </div>
          <span class="pill ${stateClass}">${stateLabel}</span>
        </div>
        <div class="stacked-bar">
          <span class="seg-pending" style="width:${pPct}%"></span>
          <span class="seg-inflight" style="width:${iPct}%"></span>
          <span class="seg-failed" style="width:${fPct}%"></span>
        </div>
        <div class="q-row">
          <div class="q-item"><span class="pill pill-inflight">${fmt(qc.inflight)}</span> in-flight</div>
          <div class="q-item"><span class="pill pill-failed">${fmt(qc.failed)}</span> failed</div>
          <div class="q-item"><span class="pill pill-submitted">${fmt(submitted)}</span> submitted</div>
        </div>
      </div>
    </div>`;
  }).join('');
}

// ── Provider Summary ──
function renderProviderSummary() {
  const svcs = state.services?.services || [];
  const active = svcs.filter(s=>!s.is_paused).length;
  const paused = svcs.filter(s=>s.is_paused).length;
  const healthy = svcs.filter(s=>s.last_status>=200 && s.last_status<300).length;
  const limited = svcs.find(s=>s.rate_limit);
  const quota = limited ? `${fmt(limited.rate_remaining)} / ${fmt(limited.rate_limit)}` : '—';
  const tiles = [
    {label:'Active',value:active,cls:active===svcs.length?'good':'warn'},
    {label:'Paused',value:paused,cls:paused?'bad':'good'},
    {label:'HTTP OK',value:healthy,cls:healthy===svcs.length?'good':'warn'},
    {label:'Rate Remaining',value:quota,cls:'good'},
  ];
  document.getElementById('provider-summary').innerHTML = tiles.map(t=>`
    <div class="kpi-tile">
      <div class="kpi-label">${t.label}</div>
      <div class="kpi-value ${t.cls}">${t.value}</div>
    </div>
  `).join('');
}

// ── Providers ──
function renderProviders() {
  const svcs = state.services?.services || [];
  document.getElementById('provider-cards').innerHTML = svcs.length===0
    ? '<div class="panel"><div class="panel-body" style="color:var(--text-muted)">No provider data</div></div>'
    : svcs.map(s=>{
    const active = !s.is_paused;
    const dotColor = active?'var(--emerald)':'var(--red)';
    const limitPct = s.rate_limit ? Math.max(0,Math.min(100,((s.rate_remaining||0)/(s.rate_limit||1))*100)) : null;
    const statusColor = !s.last_status ? 'var(--text-muted)' : s.last_status>=200&&s.last_status<300?'var(--emerald)':s.last_status>=400?'var(--red)':'var(--amber)';
    return `<div class="panel">
      <div class="provider-card">
        <div class="provider-header">
          <span class="provider-name"><span class="dot" style="background:${dotColor}"></span>${esc(s.service||'')}</span>
          <span class="pill ${active?'pill-active':'pill-paused'}">${active?'ACTIVE':'PAUSED'}</span>
        </div>
        ${s.is_paused?`<div style="font-size:.7rem;color:var(--amber);margin-bottom:6px">
          ${s.pause_reason?esc(s.pause_reason):''} ${s.pause_remaining_seconds?`· ${Math.ceil(s.pause_remaining_seconds)}s remaining`:''}
        </div>`:''}
        ${limitPct!==null?`
        <div style="display:flex;justify-content:space-between;font-size:.65rem;color:var(--text-secondary);margin-top:4px">
          <span>Rate Limit</span><span style="font-family:var(--font-mono)">${fmt(s.rate_remaining)} / ${fmt(s.rate_limit)}</span>
        </div>
        <div class="rate-bar-track"><div class="rate-bar-fill" style="width:${limitPct}%;${limitPct<20?'background:var(--red)':limitPct<50?'background:var(--amber)':''}"></div></div>
        `:''}
        <div class="provider-meta">
          <div class="meta-item"><label>HTTP Status</label><span style="color:${statusColor}">${s.last_status||'—'}</span></div>
          <div class="meta-item"><label>Updated</label><span>${relTime(s.updated_at)}</span></div>
          ${s.rate_reset?`<div class="meta-item"><label>Rate Reset</label><span>${relTime(s.rate_reset)}</span></div>`:''}
        </div>
      </div>
    </div>`;
  }).join('');
}

function errorLabel(message) {
  const text = String(message || '').trim();
  if (!text) return '';
  if (text.includes('TMDB details')) return 'TMDB details';
  if (text.includes('MDBList item')) return 'MDBList missing';
  if (text.length > 22) return text.slice(0, 21)+'…';
  return text;
}

// ── Recent Titles ──
function renderRecent() {
  const titles = state.titlesRecent?.titles || [];
  document.getElementById('recent-count').textContent = titles.length+' titles';
  const tb = document.querySelector('#recent-table tbody');
  tb.innerHTML = titles.length===0
    ? '<tr><td colspan="6" style="color:var(--text-muted)">No recent activity</td></tr>'
    : titles.map(t=>{
    const ratingDots = (t.ratings||[]).map(r=>{
      const st = (r.pmdb_status||'').toLowerCase();
      const cls = st==='submitted'?'submitted':st==='pending'?'pending':'failed';
      return `<span class="rating-dot ${cls}" title="${esc(r.label)}: ${r.score!=null?r.score:'?'} (${st})">${esc(r.label||'')}</span>`;
    }).join('');
    const typeClass = (t.media_type||'').toLowerCase()==='movie'?'pill-movie':'pill-tv';
    return `<tr>
      <td style="max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(t.title||'')}">${esc(t.title||'—')}</td>
      <td><span class="pill ${typeClass}">${esc((t.media_type||'?').toUpperCase())}</span></td>
      <td class="mono">${t.tmdb_vote_average!=null?fmtDec(t.tmdb_vote_average):'—'}</td>
      <td><div class="rating-dots">${ratingDots||'—'}</div></td>
      <td style="font-size:.75rem;color:var(--text-secondary)">${relTime(t.last_harvested_at)}</td>
      <td>${t.last_error?`<span class="error-chip" title="${esc(t.last_error)}">${esc(errorLabel(t.last_error))}</span>`:''}</td>
    </tr>`;
  }).join('');
}

// ── Logs ──
const LOG_LEVEL_PILL = {DEBUG:'pill-debug',INFO:'pill-info',WARNING:'pill-warning',ERROR:'pill-error',CRITICAL:'pill-critical'};
const LOG_CONTEXT_SKIP_KEYS = new Set(['level','logger','message','component','event','provider','exception','timestamp']);

function renderLogs() {
  const list = document.getElementById('log-list');
  if (!list) return;

  const all = state.logs?.logs || [];
  const rows = all.filter(l => Number(l.timestamp||0) > logsClearedAtEpoch);
  logsNewestVisibleTimestamp = rows.reduce((max, l) => Math.max(max, Number(l.timestamp||0)), logsClearedAtEpoch);
  document.getElementById('log-count').textContent = rows.length+' entries';

  if (rows.length === 0) {
    list.innerHTML = '<div style="padding:24px;text-align:center;color:var(--text-muted);font-size:.8rem">No logs yet</div>';
    return;
  }

  list.innerHTML = rows.map(l => {
    const level = String(l.level||'INFO').toUpperCase();
    const pillClass = LOG_LEVEL_PILL[level] || 'pill-info';
    const ms = epochMillis(l.timestamp);
    const time = ms == null ? '—' : new Date(ms).toLocaleTimeString();
    const component = l.component || l.logger || '';
    const context = Object.keys(l)
      .filter(k => !LOG_CONTEXT_SKIP_KEYS.has(k))
      .map(k => `${k}=${typeof l[k]==='object' && l[k]!==null ? JSON.stringify(l[k]) : l[k]}`)
      .join(' ');
    const exception = l.exception ? `<div class="log-exception">${esc(l.exception)}</div>` : '';
    return `<div class="log-row">
      <span class="log-time">${esc(time)}</span>
      <span class="pill ${pillClass}">${esc(level)}</span>
      <span class="log-component">${esc(component)}</span>
      <span class="log-message">${esc(l.message||'')}${context?`<span class="log-context">${esc(context)}</span>`:''}${exception}</span>
    </div>`;
  }).join('');
}

document.getElementById('log-level-filter')?.addEventListener('change', e => {
  logLevelFilter = e.target.value;
  loadAll();
});
document.getElementById('log-clear-btn')?.addEventListener('click', () => {
  logsClearedAtEpoch = logsNewestVisibleTimestamp;
  renderLogs();
});

// ─── Init & Refresh ───
loadAll();
setInterval(loadAll, 5000);
</script>
</body>
