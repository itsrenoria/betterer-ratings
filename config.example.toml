[api_keys]
tmdb = "replace-me-tmdb-key"
mdblist = "replace-me-mdblist-key"
pmdb = "replace-me-pmdb-key"

[worker]
log_level = "INFO"
source_scan_interval_hours = 1
title_refresh_days = 7
episode_refresh_days = 1
failed_retry_days = 7

[tmdb]
language = "en-US"
rate_limit = { requests = 40, per_seconds = 1.0 }

[[tmdb.sources]]
name = "movie/popular"
max_pages = 500

[[tmdb.sources]]
name = "movie/top_rated"
max_pages = 500

[[tmdb.sources]]
name = "tv/popular"
max_pages = 500

[[tmdb.sources]]
name = "tv/top_rated"
max_pages = 500

[[tmdb.sources]]
name = "trending/movie/day"
max_pages = 500

[[tmdb.sources]]
name = "trending/movie/week"
max_pages = 500

[[tmdb.sources]]
name = "trending/tv/day"
max_pages = 500

[[tmdb.sources]]
name = "trending/tv/week"
max_pages = 500

[[tmdb.sources]]
name = "trending/all/day"
max_pages = 500

[[tmdb.sources]]
name = "trending/all/week"
max_pages = 500

[imdb]
min_votes = 250
types = ["movie", "tvSeries", "tvMiniSeries", "tvMovie"]
exclude_unknown_year = true

[mdblist]
rate_limit = { requests = 2, per_seconds = 1.0 }
batch_size = 200
# MDBList accepts 1..200 IDs per ratings lookup request. This controls request
# payload size only; plan-specific daily request quotas are tracked separately.
# Optional: stop harvesting once MDBList's shared daily quota drains to this
# many requests remaining, reserving that headroom for your own MDBList usage
# (watchlist/history syncs, *arr lists, etc). 0 (default) = use the whole quota.
daily_reserve = 0

[pmdb]
api_rate_limit = { requests = 15, per_seconds = 1.0 }
ratings_limit = { requests = 15, per_seconds = 1.0 }
mappings_limit = { requests = 15, per_seconds = 1.0 }
