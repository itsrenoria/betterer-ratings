services:
  betterer-ratings:
    image: ${BETTERER_IMAGE:-ghcr.io/itsrenoria/betterer-ratings:latest}
    container_name: betterer-ratings
    restart: unless-stopped
    command: ["betterer-ratings", "--config", "/config/config.toml"]
    ports:
      - "8087:8087"
    volumes:
      - ./config.toml:/config/config.toml:ro
      - ${BETTERER_DATA_DB:-./data/db}:/data/db
      - ${BETTERER_DATA_IMDB:-./data/imdb}:/data/imdb
      - ${BETTERER_DATA_TEMP:-./data/temp}:/data/temp
    logging:
      driver: json-file
      options:
        max-size: "25m"
        max-file: "4"
